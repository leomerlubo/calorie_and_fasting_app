name: Fix SelfLove V3 Source

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'rebuild/base44-recreation' || github.ref_name == 'rebuild/base44-recreation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/base44-recreation
      - name: Fix v3 loader syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/TestAppV3.jsx')
          s = p.read_text()
          old = "const load=()=>{try{return {...DEF,...JSON.parse(localStorage.getItem(KEY)||'{}'),profile:{...DEFAULT_PROFILE,...JSON.parse(localStorage.getItem(KEY)||'{}').profile,colors:{...DEFAULT_COLORS,...JSON.parse(localStorage.getItem(KEY)||'{}').profile?.colors}}}}catch{return DEF}};"
          new = "const load=()=>{try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');return {...DEF,...saved,profile:{...DEFAULT_PROFILE,...(saved.profile||{}),colors:{...DEFAULT_COLORS,...(saved.profile?.colors||{})}}};}catch{return DEF}};"
          if old not in s:
              raise SystemExit('target loader line not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/TestAppV3.jsx
          if ! git diff --cached --quiet; then
            git commit -m "Fix SelfLove v3 loader syntax"
            git push origin HEAD:rebuild/base44-recreation
          fi
