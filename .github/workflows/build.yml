name: Build Web and Android

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build

  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx cap add android
      - name: Configure Android keyboard resize
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android:windowSoftInputMode=' not in s:
              s = s.replace('<activity', '<activity android:windowSoftInputMode="adjustResize"', 1)
          p.write_text(s)
          PY
      - name: Apply SelfLove launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="@android:color/transparent"
                  android:strokeColor="#EC5BA6"
                  android:strokeWidth="6"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round"
                  android:pathData="M54,76 C47,69 24,54 24,38 C24,27 32,20 42,20 C48,20 53,24 54,29 C55,24 60,20 66,20 C76,20 84,27 84,38 C84,54 61,69 54,76 Z" />
          </vector>
          EOF
          cat > android/app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="ic_launcher_background">#FFFFFF</color>
          </resources>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: selflove-test-v3-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
