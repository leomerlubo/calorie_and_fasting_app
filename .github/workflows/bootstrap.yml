name: Bootstrap Wellness Source

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/base44-recreation

      - name: Expand rebuilt source
        run: |
          mkdir -p /tmp/wellness-source
          tar -xzf wellness-source.tar.gz -C /tmp/wellness-source

          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name wellness-source.tar.gz ! -name .github -exec rm -rf {} +
          rm -rf .github
          cp -a /tmp/wellness-source/. .
          rm -f wellness-source.tar.gz

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .env.example .gitignore README.md capacitor.config.json index.html package.json vite.config.js src supabase .github/workflows/build.yml
          git add -u -- wellness-source.tar.gz .github/workflows/bootstrap.yml || true

          if ! git diff --cached --quiet; then
            git commit -m "Rebuild My Wellness app"
            git push origin HEAD:rebuild/base44-recreation
          fi
