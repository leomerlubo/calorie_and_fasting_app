name: Fix SelfLove V3 Syntax

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'rebuild/base44-recreation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/base44-recreation
      - name: Patch load helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/TestAppV3.jsx')
          lines = path.read_text().splitlines()
          replacement = "const load=()=>{try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');return {...DEF,...saved,profile:{...DEFAULT_PROFILE,...(saved.profile||{}),colors:{...DEFAULT_COLORS,...(saved.profile?.colors||{})}}};}catch{return DEF}};"
          changed = False
          for i, line in enumerate(lines):
              if line.startswith('const load='):
                  if line != replacement:
                      lines[i] = replacement
                      changed = True
                  break
          if changed:
              path.write_text('\n'.join(lines) + '\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TestAppV3.jsx
          if ! git diff --cached --quiet; then
            git commit -m "Fix SelfLove v3 load helper syntax"
            git push origin HEAD:rebuild/base44-recreation
          fi
